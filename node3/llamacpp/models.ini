version = 1
# models.ini - llama-server router-mode preset for node3 ("Replacing Ollama" Phase 5, model-host half; 2026-10-31).
# The server's preset (server/llamacpp/models.ini) is the reference: same contracts, same section names, same weights
# (Ollama's own blob, here read from node3's Ollama store), same sampling as `ollama show --parameters` for the tag.
# Build: llama.cpp b11562, Windows CUDA 12.4 (the server runs b11561 in Docker, which has no Windows release).

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1

# node3's only agent seat. Same blob as the server's qwen3:8b; c = Ollama's OLLAMA_CONTEXT_LENGTH on node3.
[qwen3:8b]
alias = qwen3:8b
model = C:\Users\danaj\.ollama\models\blobs\sha256-a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f
c = 32768
n-gpu-layers = 99
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1
