version = 1
# models.ini - llama-server router-mode preset for node3 ("Replacing Ollama" Phase 5, model-host half; 2026-10-31).
# The server's preset (server/llamacpp/models.ini) is the reference: same contracts, same section names, same weights
# (Ollama's own blob, here read from node3's Ollama store), same sampling as `ollama show --parameters` for the tag.
# Build: llama.cpp b11562, Windows CUDA 12.4 (the server runs b11561 in Docker, which has no Windows release).

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1

# node3's only agent seat. Same blob as the server's qwen3:8b; c = Ollama's OLLAMA_CONTEXT_LENGTH on node3.
[qwen3:8b]
alias = qwen3:8b
model = C:\Users\danaj\.ollama\models\blobs\sha256-a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f
c = 32768
n-gpu-layers = 99
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1

# Second agent seat (2026-11-03, owner's go): the server's main seat, same weights and sampling, on the 3080 (10 GB).
# The GGUF is the server's Ollama blob copied to C:\HomeLab\models (sha256 d372de8e..., checked at both ends; node3's
# Ollama has no qwen3.6). n-cpu-moe 32 and a 4096 batch were measured best (tests/results/bench-speed.tsv, host
# node3-3080-ncmoe32-ub4096: 987 to 1,227 tok/s prefill, 64 to 68 decode). n-cpu-moe 26, the most experts that
# load, overfills the card (9.7 of 10 GB) and runs at a fifth of that. Loaded on demand (about 7 s) by a window's
# first request and unloaded at its end (tests/run-window.ps1 -UnloadAtEnd); a game running ends the window
# (-YieldToGames), because node3 is also the family's gaming PC.
[qwen3.6:35b-a3b-coding]
alias = qwen3.6:35b-a3b-coding
model = C:\HomeLab\models\qwen3.6-35b-a3b-coding.gguf
c = 65536
n-gpu-layers = 99
n-cpu-moe = 32
batch-size = 4096
ubatch-size = 4096
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1
presence-penalty = 0
spec-type = draft-mtp
spec-draft-n-max = 2
# The server seat's thinking budget (2026-11-03): see server/llamacpp/models.ini.
reasoning-budget = 8192
reasoning-budget-message = Enough thinking. Act now on what you have: make the change with your tools.
