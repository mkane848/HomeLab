services:
  ollama-server:
    # PINNED, deliberately. Do not move this back to :latest.
    #
    # Whether a model emits a parseable tool call is a property of the Ollama
    # version and its bundled templates, not just the weights - and this whole
    # setup depends on it. An unattended :latest pull can silently change which
    # models can edit files, and the failure mode is an agent that reports work
    # it never did (docs/troubleshooting.md -> "Agent 'says' it edited a file").
    #
    # 0.34.3 is the version the desktop's tool-call results and task benchmark
    # were measured on (tests/results/toolcalls-summary.tsv). Bumped from 0.34.1
    # on 2026-10-12 when the server came back on a replacement board; until then
    # the live container was an unmanaged ollama/ollama:latest (0.33.3). A newer
    # tag exists (0.40.x). Moving either host is a new era for the benchmark and
    # a decision of its own - change both together, then re-run the probe:
    #   .\tests\test-toolcalls.ps1 -OllamaHost http://SERVER_IP:11434 -HostLabel server
    image: ollama/ollama:0.34.3
    container_name: ollama-server
    # "no" since Phase 3 (2026-11-01): llama.cpp (docker-compose.llamacpp.yml) is the primary engine and the one
    # that starts at boot; this container is stopped, not removed, for the soak ("Replacing Ollama" in
    # docs/roadmap.md). Roll back: `docker update --restart unless-stopped ollama-server && docker start
    # ollama-server`, after stopping the llama.cpp stack (the card cannot hold both engines' seats).
    restart: "no"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # The GPU device nodes, listed explicitly on top of the NVIDIA runtime's own
    # injection. Docker here uses the systemd cgroup driver on cgroup v2, and a
    # systemd reload (any package install, the daily apt/snap timers) rewrites a
    # container's device-access rules: with only the runtime's injection the
    # container silently loses the GPU ("Failed to initialize NVML: Unknown
    # Error") and Ollama falls back to CPU-only. On 2026-10-12 that happened at
    # 11:12Z and an hours-long benchmark batch started running qwen3.6 at 38 GB,
    # 100% CPU. Explicit devices are the toolkit's documented workaround. Tested on
    # this host 2026-10-12: after `sudo systemctl daemon-reload` the container still
    # saw the GPU (`docker exec ollama-server nvidia-smi -L`). Repeat that after any
    # Docker, driver or toolkit upgrade (docs/troubleshooting.md -> "Container lost
    # the GPU").
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Aligned with the desktop's measured setup (docs/roadmap.md -> "Next up",
      # step 2). Flash attention + a q8_0 KV cache is what lets a 64k seat fit
      # next to its companion; num_ctx per model is baked by
      # server/scripts/bake-models.sh (the other half of the desktop's
      # startup.ps1 $contextModels). The default below only serves tags that are
      # not baked.
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      # One slot. Four KV slots of a 64k 35B seat do not fit, and the harness
      # and OpenCode are single-stream anyway.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # 2: the main seat plus the CPU-pinned 3b companion (num_gpu 0).
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      # Ollama's default is 5m: a seat idle that long unloads and the next reply
      # pays a reload plus a full re-prefill (2-3.5 min for qwen3.6 on the desktop).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-4h}
    # Unhealthy when the API answers but the container cannot see the GPU: a
    # CPU-only Ollama still passes `ollama list`, which is how the loss above went
    # unnoticed. `docker ps` and server/scripts/status.sh show it.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null && nvidia-smi -L >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
