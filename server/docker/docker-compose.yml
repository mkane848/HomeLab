services:
  ollama-server:
    # PINNED, deliberately. Do not move this back to :latest.
    #
    # Whether a model emits a parseable tool call is a property of the Ollama
    # version and its bundled templates, not just the weights - and this whole
    # setup depends on it. An unattended :latest pull can silently change which
    # models can edit files, and the failure mode is an agent that reports work
    # it never did (docs/troubleshooting.md -> "Agent 'says' it edited a file").
    #
    # 0.34.1 is the version every tool-calling result in the docs was measured
    # against. Bumped from 0.34.0 on 2026-09-19 to match the desktop, which
    # auto-updated; the probe was re-run there and reproduced every result
    # including each failure's mode (tests/results/toolcalls-0.34.1.txt).
    #
    # This host has NEVER been probed - it has been down since before
    # tests/test-toolcalls.ps1 existed. Re-run it against this host BEFORE
    # trusting any seat here, on this version or any bump:
    #   .\tests\test-toolcalls.ps1 -OllamaHost http://SERVER_IP:11434
    image: ollama/ollama:0.34.1
    container_name: ollama-server
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      # RTX 4070 Ti Super (16GB): 7B Q4 ~4.7GB, 14B Q4 ~9GB, 16k KV comfortable.
      # Context length is honored here (Linux/Docker) - raise via .env only if
      # serving smaller models with lots of headroom.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
