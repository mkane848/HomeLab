services:
  ollama-server:
    # PINNED, deliberately. Do not move this back to :latest.
    #
    # Whether a model emits a parseable tool call is a property of the Ollama
    # version and its bundled templates, not just the weights - and this whole
    # setup depends on it. An unattended :latest pull can silently change which
    # models can edit files, and the failure mode is an agent that reports work
    # it never did (docs/troubleshooting.md -> "Agent 'says' it edited a file").
    #
    # 0.34.3 is the desktop's version, the one every result since 2026-09-22
    # was measured on (0.34.1 before that; tests/results/toolcalls-0.34.1.txt).
    # Bumped from 0.34.1 on 2026-10-10 so the server's results compare with the
    # desktop's (docs/roadmap.md -> "Next up (2026-10-10): server first").
    #
    # This host has NEVER been probed - it has been down since before
    # tests/test-toolcalls.ps1 existed. Re-run it against this host BEFORE
    # trusting any seat here, on this version or any bump:
    #   .\tests\test-toolcalls.ps1 -OllamaHost http://SERVER_IP:11434
    image: ollama/ollama:0.34.3
    container_name: ollama-server
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      # The desktop's measured setup (AGENTS.md; aligned 2026-10-10). Results
      # from this host compare with the desktop's only while these match;
      # tests/test-server-config.ps1 checks them. A server/docker/.env left
      # over from before overrides these defaults: check it at bring-up.
      # Global default context. Seats get their own num_ctx baked into the tag
      # by server/scripts/bake-models.sh (models/server-seats.tsv), the same
      # values and tag names as the desktop.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      # Flash attention + 8-bit KV cache, as on the desktop.
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # One request at a time per model: Ollama gives each parallel request its
      # own KV slot, and four 64k slots of the 35B main seat do not fit 16 GB.
      # The harness runs one attempt per host anyway.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      # 4h, as on the desktop: with Ollama's 5 min default a model idle between
      # turns unloads, and the next reply pays a reload plus a full re-prefill.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-4h}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
