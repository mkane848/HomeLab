version = 1
# models.ini - llama-server router-mode preset for the server (engine trial,
# docs/llamacpp-trial.md). Read by docker-compose.llamacpp.yml as
# --models-preset /config/models.ini.
#
# Format (llama.cpp tools/server/README.md, "Model presets"): keys are the
# command-line flags without their dashes; a [section] per model; [*] holds
# defaults shared by every model; precedence is command line > model section > [*].
#
# THE CONTRACTS THIS FILE KEEPS (server/scripts/llamacpp-check.sh checks them):
#  1. A section is named exactly like the Ollama tag it replaces, so
#     `llamacpp-server/qwen3.6:35b-a3b-coding` parallels `ollama-server/...` and one
#     tests/run-tasks-models.tsv row can cover both. Router mode reads the part after
#     a ':' as a quant tag and rewrites the id (qwen3.6:35b-a3b-coding -> qwen3.6:CODING,
#     qwen3:8b -> qwen3:8B; build b11561, 2026-10-13), so such a section also sets
#     `alias = <the same tag>`, which keeps the exact tag addressable.
#  2. Its weights are Ollama's own blob: /ollama/models/blobs/sha256-<hex> is the
#     read-only Ollama volume, and <hex> must equal the `weights` column of
#     models/server-seats.tsv. Same bytes, so a difference in results is the engine.
#  3. `c` (context) is explicit in EVERY section and equals `num_ctx` in
#     models/server-seats.tsv, which equals limit.context in opencode.jsonc. It is
#     the other half of the contract startup.ps1's $contextModels is on the desktop.
#  4. One slot (`parallel = 1`). `c` is shared across slots, so an automatic slot
#     count would silently cut each request's window; check /props total_slots.
#  5. Sampling matches what Ollama applies to the same tag. Ollama gives a model
#     its registry parameters (temperature, top_k, top_p, repeat_penalty ...);
#     llama-server uses ITS defaults unless told. Copy them across before any
#     measurement - `llamacpp-check.sh --ollama-url http://localhost:11434` lists
#     what is missing or different:
#         docker exec ollama-server ollama show --parameters <tag>
#     and set the matching keys (temp, top-k, top-p, min-p, repeat-penalty,
#     presence-penalty ...) in the section.
#
# Starting values, not results: n-cpu-moe below is where the sweep begins.

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1

# Main seat. 35B MoE, 3B active; ~20.3 GB of weights. Experts of the first
# n-cpu-moe layers stay in system RAM, everything else is on the GPU. Ollama
# measured 19 of 42 layers overflowing (22.68 GB total, 13.59 GB in VRAM); the
# sweep to try is n-cpu-moe 16..24, keeping VRAM headroom (Ollama leaves ~780 MiB)
# and reading prefill/decode from tests/bench-speed.ps1 -Engine llamacpp.
# Text only here: Ollama's copy lists image input, but the vision projector is a
# separate file (mmproj) this preset does not load.
[qwen3.6:35b-a3b-coding]
alias = qwen3.6:35b-a3b-coding
model = /ollama/models/blobs/sha256-d372de8e934898a59e6ccfabc3368474711384d8f1fd4d22d87a3f0a45400cdc
c = 65536
n-gpu-layers = 99
n-cpu-moe = 16
# Sampling = `ollama show --parameters` for the tag (trial step 3, 2026-10-13).
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1
presence-penalty = 0
# Speculative decoding as Ollama 0.34.3 serves this tag: its bundled llama-server runs
# `--spec-type draft-mtp --spec-draft-n-max 2` (draft_num_predict 2), drafting with the
# MTP layers inside these same weights (trial step 5, 2026-10-13).
spec-type = draft-mtp
spec-draft-n-max = 2

# Light general seat; fits on the GPU entirely (7.5 GB loaded under Ollama).
[qwen3:8b]
alias = qwen3:8b
model = /ollama/models/blobs/sha256-a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f
c = 32768
n-gpu-layers = 99
# Sampling = `ollama show --parameters` for the tag (trial step 3, 2026-10-13). Ollama
# sets no min_p here, so its own default (0) applies; llama-server's would be 0.05.
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1

# The OpenCode small model (titles), on the CPU so it can never evict the main
# seat. The 3b weights with no layers on the GPU - the llama.cpp form of Ollama's
# `num_gpu 0` derived model. Check nvidia-smi after loading it: a CUDA build can
# still reserve a little VRAM for its context; if it does, try `device = none`.
# Measured 2026-10-13 (trial step 2): 332 MiB of VRAM with n-gpu-layers = 0 alone,
# 0 MiB with device = none.
[qwen2.5-coder-3b-cpu]
model = /ollama/models/blobs/sha256-4a188102020e9c9530b687fd6400f775c45e90a0d7baafe65bd0a36963fbb7ba
c = 16384
n-gpu-layers = 0
device = none

# Candidate executor from the model sweep (docs/roadmap.md -> "After the trial" item 9;
# probe PASS 2026-10-23). 21B MoE, 13.8 GB of MXFP4 weights: it fits the GPU whole, so it
# must not be resident beside qwen3.6 (--models-max counts models, not VRAM): unload
# qwen3.6 before loading this seat. Ollama's blob carries no usable chat template, so the
# official one is loaded from the repo (templates/README.md); without it the probe fails.
# Context as qwen3.6's, so the two compare under the same read budget and compaction.
# Sampling = `ollama show --parameters` for the tag (temperature 1 only).
[gpt-oss:20b]
alias = gpt-oss:20b
model = /ollama/models/blobs/sha256-8ecb5d4ad6172c63f9cbf1a07a04e525985a8a11a6e516da02b674c4010de716
c = 65536
n-gpu-layers = 99
chat-template-file = /config/templates/openai-gpt-oss-120b.jinja
temp = 1
