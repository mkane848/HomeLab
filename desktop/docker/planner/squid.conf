# squid.conf - the planner's only way out (docs/planner-tests-experiment.md, "The planner").
#
# The planner container sits on an internal network with no route out; this proxy is the one thing on that network
# that can reach the internet, and it answers only for the hosts below. The task repos are public on GitHub, so
# "do not look the fix up" is enforced here, not asked for in the prompt: github.com is not on the list.
#
# HTTPS only (CONNECT to 443). No caching, no logging of request bodies.

http_port 3128

acl allowed_hosts dstdomain api.anthropic.com registry.npmjs.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_hosts
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/null
pid_filename /tmp/squid.pid
via off
forwarded_for delete
